# NanoPi R28S: on-board I2C RTC (Haoyu HYM8563, i2c1 @ 0x51).
# The DTB already declares the node, but the driver is a module
# (CONFIG_RTC_DRV_HYM8563=m) and nothing else pulls it in, so without this the
# kernel never binds it: no /dev/rtc0, and the clock is not kept across reboots
# even when the backup battery (2-pin 1.25mm connector) is fitted.
rtc-hym8563
