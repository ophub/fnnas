# NanoPi R28S: AIC8800 SDIO WiFi driver options
#
# The AIC8800 out-of-tree driver defaults to firmware dir
# /lib/firmware/aic8800/sdio — exactly where this board's firmware files are
# installed (see rootfs/usr/lib/firmware/aic8800/sdio/). The path is stated
# explicitly so it keeps working if a future driver build changes its default.
#
# Only the firmware path is overridden here on purpose: every extra option is a
# chance to break module load, and the driver defaults for the rest are fine.
options aic8800_bsp aic_fw_path=/lib/firmware/aic8800/sdio
